services:
  # Caddy va DELANTE de PocketBase por lo mismo que en tareas: comprimir y
  # mandar Cache-Control (PocketBase no hace ninguna de las dos). Dos entradas:
  #   :8093 → tailnet / LAN (todo abierto; solo llegan dispositivos tuyos)
  #   :8094 → pública, solo en 127.0.0.1: la recoge el cloudflared general del
  #           host (corre en red host) y la publica como notes.samukis.xyz.
  #           Ahí el admin y el registro de cuentas están cerrados (Caddyfile).
  caddy:
    image: caddy:2-alpine
    container_name: notes-caddy
    restart: unless-stopped
    ports:
      - "8093:8093"
      - "127.0.0.1:8094:8094"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pocketbase:
        condition: service_healthy

  pocketbase:
    build: ./pocketbase
    container_name: notes-pocketbase
    restart: unless-stopped
    # Sin `ports`: solo le habla Caddy por la red interna.
    expose:
      - "8090"
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:?define PB_ADMIN_EMAIL en .env}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:?define PB_ADMIN_PASSWORD en .env}
      TZ: ${TZ:-America/Lima}
      # El hook pb_hooks/search.pb.js avisa al buscador de cada nota que cambia.
      BUSCADOR_URL: http://buscador:8095
      INDEX_TOKEN: ${INDEX_TOKEN:?define INDEX_TOKEN en .env}
    volumes:
      - ./data/pb_data:/pb/pb_data          # la base de datos (haz backup de esta carpeta)
      - ./pb_public:/pb/pb_public:ro        # la PWA: se edita sin reconstruir
      - ./pb_hooks:/pb/pb_hooks:ro          # rutas y hooks (PocketBase se reinicia solo al cambiar)
      - ./pb_migrations:/pb/pb_migrations:ro # el esquema, versionado (se aplican al arrancar)
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # El buscador: índice propio (FTS5 de palabras y trigramas + vectores con
  # sqlite-vec) en /data, y el modelo de embeddings cacheado en /data/models.
  # Lee TODAS las notas de PocketBase como superusuario y filtra por dueño en
  # cada consulta, validando el token del usuario que pregunta. Caddy le pasa
  # /search* en las dos entradas. Ver buscador/README.md.
  buscador:
    build: ./buscador
    container_name: notes-buscador
    restart: unless-stopped
    expose:
      - "8095"
    environment:
      PB_URL: http://pocketbase:8090
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      INDEX_TOKEN: ${INDEX_TOKEN:?define INDEX_TOKEN en .env}
      EMBED_MODEL: ${EMBED_MODEL:-jinaai/jina-embeddings-v2-base-es}
      SYNC_SECONDS: ${SYNC_SECONDS:-60}
      TZ: ${TZ:-America/Lima}
    volumes:
      - ./data/buscador:/data
    depends_on:
      pocketbase:
        condition: service_healthy

  # El conector MCP de Claude (web y móvil) en modo HTTP. Un solo archivo sin
  # dependencias: se monta, no se construye; tras cambiarlo basta
  # `docker compose restart mcp`. Solo lo alcanza Caddy por la red interna; la
  # URL pública es https://notes.samukis.xyz/mcp/<MCP_PATH_TOKEN>. Habla con
  # PocketBase y con el buscador directamente (sin pasar por Caddy) con la
  # cuenta de usuario del .env, nunca con el superusuario.
  mcp:
    image: node:20-alpine
    container_name: notes-mcp
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ./mcp:/app:ro
      # md.js es el MISMO de la web y los hooks: el MCP lo usa para presentar.
      - ./pb_public/js:/pbjs:ro
    expose:
      - "8092"
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      MCP_HTTP_PORT: "8092"
      MCP_PATH_TOKEN: ${MCP_PATH_TOKEN:?define MCP_PATH_TOKEN en .env}
      NOTAS_URL: http://pocketbase:8090
      NOTAS_SEARCH_URL: http://buscador:8095/search
      NOTAS_EMAIL: ${MCP_NOTAS_EMAIL:?define MCP_NOTAS_EMAIL en .env}
      NOTAS_PASSWORD: ${MCP_NOTAS_PASSWORD:?define MCP_NOTAS_PASSWORD en .env}
      NOTAS_MD_JS: /pbjs/md.js
      NOTAS_TZ: ${TZ:-America/Lima}
      TZ: ${TZ:-America/Lima}

volumes:
  caddy_data:
  caddy_config:
