<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Notas</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notas">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<!-- Regla dura (ver CLAUDE.md): al editar un js/css hay que subir el ?v=
     de TODOS, porque Caddy los cachea un año por URL. -->
<link rel="stylesheet" href="/styles.css?v=6">
</head>
<body>
<div id="app" data-view="list">
  <nav id="side" class="side"></nav>
  <main class="main">
    <header id="head" class="head"></header>
    <!-- La barra de formato: en el teléfono pegada sobre el teclado
         (position:fixed), en escritorio aquí mismo, entre cabecera y
         contenido. La pinta toolbarHTML(). -->
    <div id="toolbar" class="toolbar"></div>
    <div id="content" class="content"></div>
  </main>
  <button id="fab" class="fab" title="Nueva nota" aria-label="Nueva nota"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<!-- Fuera de #app: no los toca morph() y no quedan atrapados en su contexto de apilamiento. -->
<div id="scrim" class="scrim"></div>
<div id="pop" class="pop"></div>
<div id="modal" class="modal"></div>
<div id="netbar"></div>
<div id="toasts" aria-live="polite"></div>
<input id="file-in" type="file" accept="image/*" multiple hidden>
<div id="login" class="login">
  <form class="lg-card" onsubmit="event.preventDefault();doLogin()">
    <img class="lg-logo" src="/icons/icon-192.png" alt="">
    <h2>Notas</h2>
    <p class="lg-sub">Entra con tu cuenta</p>
    <input id="lg-email" type="email" placeholder="correo" autocomplete="username" required>
    <input id="lg-pass" type="password" placeholder="contraseña" autocomplete="current-password" required>
    <div id="lg-err" class="lg-err"></div>
    <button id="lg-btn" type="submit">Entrar</button>
  </form>
</div>
<script src="/js/morphdom.js?v=6"></script>
<script src="/js/prosemirror.js?v=6"></script>
<script src="/js/md.js?v=6"></script>
<script src="/js/mdpm.js?v=6"></script>
<script src="/js/icons.js?v=6"></script>
<script src="/js/state.js?v=6"></script>
<script src="/js/idb.js?v=6"></script>
<script src="/js/toast.js?v=6"></script>
<script src="/js/sync.js?v=6"></script>
<script src="/js/editor.js?v=6"></script>
<script src="/js/render.js?v=6"></script>
<script src="/js/actions.js?v=6"></script>
<script src="/js/boot.js?v=6"></script>
</body>
</html>
